# API list prices, for the "API-equivalent list cost" figure only: what this
# usage would have cost at the vendor's pay-per-call API price. It is never
# a bill, and never added to a subscription.
#
# Units: whole micro-dollars per million tokens ($4.00 per MTok = 4000000).
# Dimensions: input (uncached), output (including reasoning or thinking),
# cache_read, cache_write_5m, cache_write_1h. A missing cache price falls
# back to the input price, never to zero.
# `from` (YYYY-MM-DD, UTC) starts a row; a row with no `from` applies to all
# earlier usage. `over_input` marks a long-context row that applies when one
# request's input is above that many tokens.
# Every row names its source and the day it was checked. A model with no
# row is shown as "unpriced", never as $0.

# ── Anthropic ────────────────────────────────────────────────────────────
# Cache writes are 1.25x (5 min) and 2x (1 h) of input; reads as listed.
# No long-context premium on these 1M-context models.

[[price]]
model = "claude-fable-5-1"
input = 10000000
output = 50000000
cache_read = 250000
cache_write_5m = 12500000
cache_write_1h = 20000000
source = "https://platform.claude.com/docs/en/about-claude/pricing"
checked = "2026-10-07"

