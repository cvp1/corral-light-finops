# Known subscription plans and their list prices, offered as hints only.
# A catalogue price is never written as the operator's: it shows as
# "list price as of <date>, not confirmed" until the operator types an
# amount in `corral-light finops setup`.
#
# Matching: `vendor` and the plan the vendor states (`vendor_plan`); when
# `tier` is given, the vendor's tier must contain it. A plan the vendor
# does not state, or states in a way no row matches, gets no price at all.
# Plans whose price could not be confirmed are left out on purpose.

[[plan]]
id = "claude-pro"
vendor = "claude"
